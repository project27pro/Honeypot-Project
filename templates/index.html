<!DOCTYPE html>
<html lang="ar">
<head>
    <meta charset="UTF-8">
    <title>Raven Store - Honeypot Dashboard</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
    <style>
        body { background-color: #0b0e14; color: #ecf0f1; font-family: sans-serif; }
        .card { background-color: #1c1f26; border: none; border-radius: 15px; }
        .table { color: #bdc3c7; }
        .status-badge { color: #2ecc71; font-weight: bold; }
    </style>
</head>
<body>
    <div class="container mt-5">
        <h2 class="text-center mb-4">🛡️ لوحة مراقبة الهجمات السيبرانية - متجر ريڤن</h2>
        <div class="card p-4 shadow">
            <h5 class="mb-3">الهجمات المكتشفة لحظياً: <span class="status-badge">Active</span></h5>
            <table class="table table-hover mt-3">
                <thead class="table-dark">
                    <tr>
                        <th>الوقت</th>
                        <th>عنوان IP المهاجم</th>
                        <th>المنفذ المستهدف</th>
                    </tr>
                </thead>
                <tbody>
                    {% for attack in attacks %}
                    <tr>
                        <td>{{ attack.time }}</td>
                        <td class="text-danger"><strong>{{ attack.ip }}</strong></td>
                        <td><span class="badge bg-primary">{{ attack.port }}</span></td>
                    </tr>
                    {% endfor %}
                </tbody>
            </table>
        </div>
    </div>
</body>
</html>
